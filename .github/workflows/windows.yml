name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Verify stop and drain lifecycle
        run: cargo test --locked --manifest-path validation/lifecycle/Cargo.toml
      - name: Verify synthetic clock-window classifications
        run: python validation/verify_window.py validation/fixed_window.json
      - name: Verify owned system ETW process and file controls
        timeout-minutes: 3
        env:
          TRACESCALPEL_SYSTEM_ETW_CONTROL: "1"
        run: |
          cargo test --locked --lib owned_system_process_file_control -- --ignored --nocapture --test-threads=1 2>&1 |
            Tee-Object -Variable control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($control -match '^test result: ok\. 1 passed;')) {
            throw 'Expected one passing native system ETW test'
          }
